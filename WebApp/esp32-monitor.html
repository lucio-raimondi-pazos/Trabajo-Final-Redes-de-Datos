<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor ESP32</title>
<style>
:root{
  --bg:#e8eef0; --panel:#f8fbfc; --ink:#12202b; --muted:#5a6b76; --line:#cbd6db;
  --temp:#d6336c; --hum:#0b7a8f; --ok:#2f9e5b; --err:#c92a2a; --demo:#b7791f;
  --font:"Bricolage Grotesque","Avenir Next","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1920; --panel:#15242d; --ink:#e7eff3; --muted:#8fa3ae;
    --line:#263a45; --temp:#ff6b9a; --hum:#4cc9e0; --ok:#5ad18a; --err:#ff7b7b; --demo:#e8b34f;
  }
}
*{box-sizing:border-box;margin:0}
html{color-scheme:light dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100vh;
  display:flex;flex-direction:column;padding:clamp(16px,4vw,48px);gap:clamp(20px,4vw,40px)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.conn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:8px 8px 8px 16px;font-size:.9rem;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
.ok .dot{background:var(--ok)}
.err .dot{background:var(--err)} .demo .dot{background:var(--demo)}
.idle .dot{background:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:6px 14px;
  background:var(--ink);color:var(--bg);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.on{background:var(--demo);color:#12202b;border-color:transparent}
button.auto-on{background:var(--hum);color:#fff;border-color:transparent}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,input:focus-visible{outline:3px solid var(--hum);outline-offset:2px}
.auto-wrap{display:flex;align-items:center;gap:6px}
.auto-wrap input{width:3.2rem;font:inherit;padding:5px 8px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);text-align:center}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,3vw,28px);flex:1;align-content:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,3vw,34px);
  display:flex;flex-direction:column;gap:22px;transition:opacity .3s}
.panel.stale{opacity:.55}
.panel h2{font-size:1.05rem;font-weight:600;color:var(--c)}
.value{display:flex;align-items:baseline;gap:6px;line-height:.9}
.num{font-size:clamp(4.5rem,13vw,7.5rem);font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.unit{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:400;color:var(--muted)}
.track{position:relative;height:10px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.track i{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--c);
  border:4px solid var(--panel);transform:translate(-50%,-50%);left:0;transition:left .6s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 0 1px var(--c)}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:8px}
.spark{width:100%;height:64px;display:block}
.spark path.line{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark path.area{fill:var(--c);opacity:.12}
dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid var(--line);padding-top:16px}
dt{color:var(--muted);font-size:.8rem} dd{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Monitor ESP32</h1>
    <p class="sub" id="where">GET /datos</p>
  </div>
  <div class="conn idle" id="conn">
    <span class="dot"></span><span id="status">Sin datos</span>
    <button id="mock" type="button" class="ghost" aria-pressed="false">Mock</button>
    <button id="refresh" type="button">Actualizar</button>
    <div class="auto-wrap">
      <button id="auto" type="button" class="ghost" aria-pressed="false">Auto</button>
      <input id="every" type="number" min="1" max="3600" step="1" value="5" title="Segundos entre consultas" aria-label="Segundos">
      <span class="sub">s</span>
    </div>
  </div>
</header>

<main id="panels"></main>
<footer id="stamp">Pulsá Actualizar (a demanda) o activá Auto cada N segundos.</footer>

<script>
const SENSORS = [
  {id:'t', label:'Temperatura', unit:'°C', keys:['temperatura','temperature','temp','t'], min:-10, max:50,  dec:1, color:'var(--temp)'},
  {id:'h', label:'Humedad',     unit:'%',  keys:['humedad','humidity','hum','h'],        min:0,   max:100, dec:0, color:'var(--hum)'}
];
const DATOS_URL = '/datos';
const MAX_POINTS = 90, TIMEOUT_MS = 4000;

const $ = s => document.querySelector(s);
let cfg = {demo:false, auto:false, every:5};
try {
  const saved = JSON.parse(localStorage.getItem('esp32cfg')||'{}');
  if(typeof saved.demo === 'boolean') cfg.demo = saved.demo;
  if(typeof saved.auto === 'boolean') cfg.auto = saved.auto;
  if(saved.every > 0) cfg.every = saved.every;
} catch(e){}
const hist = Object.fromEntries(SENSORS.map(s=>[s.id,[]]));
let timer = null;
let fetching = false;

$('#panels').innerHTML = SENSORS.map(s=>`
  <article class="panel stale" id="p-${s.id}" style="--c:${s.color}">
    <h2>${s.label}</h2>
    <div class="value"><span class="num">--</span><span class="unit">${s.unit}</span></div>
    <div>
      <div class="track"><i></i></div>
      <div class="scale"><span>${s.min}${s.unit}</span><span>${s.max}${s.unit}</span></div>
    </div>
    <svg class="spark" viewBox="0 0 200 64" preserveAspectRatio="none" aria-hidden="true">
      <path class="area"/><path class="line"/>
    </svg>
    <dl>
      <div><dt>Mínima</dt><dd data-k="min">--</dd></div>
      <div><dt>Promedio</dt><dd data-k="avg">--</dd></div>
      <div><dt>Máxima</dt><dd data-k="max">--</dd></div>
    </dl>
  </article>`).join('');

const fmt = (v,d) => v.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});

function saveCfg(){
  try{ localStorage.setItem('esp32cfg', JSON.stringify(cfg)); }catch(e){}
}

function render(s, v){
  const h = hist[s.id]; h.push(v); if(h.length>MAX_POINTS) h.shift();
  const p = $('#p-'+s.id); p.classList.remove('stale');
  p.querySelector('.num').textContent = fmt(v,s.dec);
  const pct = Math.min(100,Math.max(0,(v-s.min)/(s.max-s.min)*100));
  p.querySelector('.track i').style.left = pct+'%';
  const lo=Math.min(...h), hi=Math.max(...h), avg=h.reduce((a,b)=>a+b,0)/h.length;
  p.querySelector('[data-k=min]').textContent = fmt(lo,s.dec);
  p.querySelector('[data-k=avg]').textContent = fmt(avg,s.dec);
  p.querySelector('[data-k=max]').textContent = fmt(hi,s.dec);
  const span = (hi-lo)||1, n=Math.max(h.length-1,1);
  const pts = h.map((y,i)=>[i/n*200, 58-((y-lo)/span)*52]);
  const d = pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  p.querySelector('.line').setAttribute('d', d);
  p.querySelector('.area').setAttribute('d', pts.length>1 ? d+`L200 64L0 64Z` : '');
}

function pick(obj, keys){
  for(const k of keys){ if(k in obj && isFinite(parseFloat(obj[k]))) return parseFloat(obj[k]); }
  return null;
}

function setStatus(kind, text){
  $('#conn').className = 'conn '+kind;
  $('#status').textContent = text;
}

async function getData(){
  if(cfg.demo){
    const t = Date.now();
    return {temperatura: 24 + 4*Math.sin(t/25000) + Math.random()*.4,
            humedad: 55 + 12*Math.cos(t/32000) + Math.random()*.8};
  }
  const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), TIMEOUT_MS);
  try{
    const r = await fetch(DATOS_URL, {signal:ctl.signal, cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}

function stopAuto(){
  clearTimeout(timer);
  timer = null;
  cfg.auto = false;
  $('#auto').classList.remove('auto-on');
  $('#auto').setAttribute('aria-pressed','false');
  $('#auto').textContent = 'Auto';
  saveCfg();
}

function scheduleNext(){
  clearTimeout(timer);
  if(!cfg.auto) return;
  const ms = Math.max(1, cfg.every) * 1000;
  timer = setTimeout(() => actualizar(true), ms);
}

async function actualizar(fromAuto){
  if(fetching) return;
  fetching = true;
  if(!fromAuto) $('#refresh').disabled = true;
  setStatus(cfg.demo ? 'demo' : 'idle', 'Consultando…');
  try{
    const data = await getData();
    let got = 0;
    SENSORS.forEach(s=>{ const v = pick(data,s.keys); if(v!==null){ render(s,v); got++; } });
    if(!got) throw new Error('JSON sin los campos esperados');
    setStatus(cfg.demo?'demo':'ok', cfg.demo?'Modo demo':'Datos en vivo');
    const modo = fromAuto || cfg.auto ? ('auto '+cfg.every+'s') : 'a demanda';
    $('#stamp').textContent = 'Actualizado '+new Date().toLocaleTimeString('es-AR')+' ('+modo+')';
  }catch(e){
    document.querySelectorAll('.panel').forEach(p=>p.classList.add('stale'));
    setStatus('err','Sin respuesta del ESP32');
    $('#stamp').textContent = 'No se pudo leer /datos. Revisá la red y el nodo.';
    if(cfg.auto) stopAuto();
  } finally {
    fetching = false;
    $('#refresh').disabled = false;
    if(cfg.auto) scheduleNext();
  }
}

function syncUi(){
  $('#every').value = cfg.every;
  $('#mock').classList.toggle('on', cfg.demo);
  $('#mock').setAttribute('aria-pressed', cfg.demo ? 'true' : 'false');
  $('#where').textContent = cfg.demo ? 'Mock activo · GET /datos' : 'GET /datos';
  if(cfg.auto){
    $('#auto').classList.add('auto-on');
    $('#auto').setAttribute('aria-pressed','true');
    $('#auto').textContent = 'Detener';
  } else {
    $('#auto').classList.remove('auto-on');
    $('#auto').setAttribute('aria-pressed','false');
    $('#auto').textContent = 'Auto';
  }
  if(cfg.demo) setStatus('demo', 'Modo demo');
  else setStatus('idle', 'Listo');
}

$('#mock').onclick = ()=>{
  cfg.demo = !cfg.demo;
  saveCfg();
  syncUi();
};

$('#refresh').onclick = () => actualizar(false);

$('#auto').onclick = ()=>{
  if(cfg.auto){
    stopAuto();
    syncUi();
    return;
  }
  cfg.every = Math.max(1, +$('#every').value || 5);
  cfg.auto = true;
  saveCfg();
  syncUi();
  actualizar(true);
};

$('#every').onchange = ()=>{
  cfg.every = Math.max(1, +$('#every').value || 5);
  $('#every').value = cfg.every;
  saveCfg();
  if(cfg.auto) scheduleNext();
};

syncUi();
if(cfg.auto) actualizar(true);
</script>
</body>
</html>
